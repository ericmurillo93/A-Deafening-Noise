[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Ensure /.netlify/functions/* requests are NOT caught by the SPA redirect
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
