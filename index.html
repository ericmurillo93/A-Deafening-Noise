<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="A Deafening Noise is a personal concert archive: searchable past shows, upcoming concerts, and stats." />
    <meta property="og:title" content="A Deafening Noise" />
    <meta property="og:description" content="A searchable personal concert archive." />
    <meta property="og:type" content="website" />
    <script>
      try {
        const theme = localStorage.getItem("adn-theme");
        document.documentElement.dataset.theme = ["archive", "poster", "signal"].includes(theme) ? theme : "archive";
      }
      catch { document.documentElement.dataset.theme = "archive"; }
    </script>
    <title>A Deafening Noise</title>
  </head>
  <body>
    <noscript>A Deafening Noise requires JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
