name: Weekly ticket reminders
on:
  schedule:
    # Madrid 08:00 in summer/winter; the sender guards local time and deduplicates the week.
    - cron: "0 6,7 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview eligibility without sending emails
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: weekly-ticket-reminders
  cancel-in-progress: false
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Send one weekly digest per eligible user
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/send-weekly-ticket-reminders.mjs "${args[@]}"
