name: Refresh concert suggestions

on:
  workflow_dispatch:
    inputs:
      send_test_email:
        description: Send the current YUNG BEEF suggestion to the administrator only
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write

concurrency:
  group: concert-suggestions
  cancel-in-progress: false

jobs:
  test-email:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_email == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Send test suggestion email
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: node scripts/send-suggestion-test-email.mjs "YUNG BEEF"

  refresh:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.send_test_email != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Preserve previous suggestions
        run: cp data/suggestions.json /tmp/previous-suggestions.json

      - name: Sync connected Spotify profiles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: npm run spotify:sync

      - name: Run concert scrapers
        run: npm run suggestions:refresh

      - name: Notify users about new suggestions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: node scripts/notify-concert-suggestions.mjs /tmp/previous-suggestions.json data/suggestions.json

      - name: Commit refreshed suggestions
        run: |
          if git diff --quiet -- data/listened-artists.json data/suggestions.json; then
            echo "No suggestion changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listened-artists.json data/suggestions.json
          git commit -m "Refresh concert suggestions"
          git push
