name: Refresh concert suggestions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

concurrency:
  group: concert-suggestions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run concert scrapers
        run: |
          node scripts/scrape-resurrection-route.mjs --output=/tmp/resurrection.json
          node scripts/scrape-livenation-events.mjs --output=/tmp/livenation.json
          node scripts/scrape-madness-live.mjs --output=/tmp/madness-live.json

      - name: Combine suggestions
        run: node scripts/combine-concert-suggestions.mjs /tmp/resurrection.json /tmp/livenation.json /tmp/madness-live.json --output=data/suggestions.json

      - name: Commit refreshed suggestions
        run: |
          if git diff --quiet -- data/suggestions.json; then
            echo "No suggestion changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/suggestions.json
          git commit -m "Refresh concert suggestions"
          git push
