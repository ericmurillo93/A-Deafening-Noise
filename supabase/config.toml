project_id = "a-deafening-noise"

[api]
enabled = true
schemas = ["public", "graphql_public"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://127.0.0.1:5173/**"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 6

[auth.email.template.confirmation]
subject = "Confirm your A Deafening Noise account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your A Deafening Noise password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "You are invited to A Deafening Noise"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Your A Deafening Noise sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new email address"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "{{ .Token }} is your verification code"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Your password was changed"
content_path = "./templates/password_changed.html"

[auth.email.notification.email_changed]
enabled = true
subject = "Your email address was changed"
content_path = "./templates/email_changed.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
